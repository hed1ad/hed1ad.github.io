<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="flex min-h-screen flex-col bg-neutral-50 text-neutral-800 dark:bg-neutral-950 dark:text-neutral-200">
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <aside id="sidebar" class="sidebar" aria-hidden="true">
      {{ partial "profile.html" . }}
    </aside>
    <main class="mx-auto w-full max-w-2xl flex-1 px-4 pb-10 pt-16">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ with resources.Get "js/code-copy.js" }}
      {{ $js := . | minify | fingerprint }}
      <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{ end }}
    {{ with resources.Get "js/sidebar.js" }}
      {{ $js := . | minify | fingerprint }}
      <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{ end }}
  </body>
</html>
