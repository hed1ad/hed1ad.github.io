{{ define "main" }}
  <h1 class="mb-8 text-xl font-semibold text-neutral-900 dark:text-neutral-100">{{ .Title }}</h1>
  <div class="flex flex-wrap gap-2">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="rounded border border-neutral-200 px-2 py-1 text-sm text-neutral-600 transition-colors hover:border-neutral-400 hover:text-neutral-900 dark:border-neutral-800 dark:text-neutral-400 dark:hover:border-neutral-600 dark:hover:text-neutral-100">
        #{{ .LinkTitle | lower }} <span class="text-neutral-400 dark:text-neutral-600">{{ len .Pages }}</span>
      </a>
    {{ end }}
  </div>
{{ end }}
