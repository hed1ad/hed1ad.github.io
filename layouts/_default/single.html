{{ define "main" }}
  <article>
    <header class="mb-8">
      <h1 class="text-2xl font-semibold tracking-tight text-neutral-900 sm:text-3xl dark:text-neutral-100">{{ .Title }}</h1>
      {{ if not .Date.IsZero }}
        <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-neutral-500 dark:text-neutral-400">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
          <span>·</span>
          <span>{{ .ReadingTime }} min read</span>
          {{ with .GetTerms "tags" }}
            <span>·</span>
            <span class="flex flex-wrap gap-2">
              {{ range . }}
                <a href="{{ .RelPermalink }}" class="hover:text-blue-600 dark:hover:text-blue-400">#{{ .LinkTitle | lower }}</a>
              {{ end }}
            </span>
          {{ end }}
        </div>
      {{ end }}
    </header>
    <div class="prose prose-neutral max-w-none dark:prose-invert" data-pagefind-body>
      {{ .Content }}
    </div>
    {{ if eq .Section "posts" }}
      <div class="mt-12 border-t border-neutral-200 pt-6 dark:border-neutral-800">
        <a href="{{ "/posts/" | relURL }}" class="text-sm text-neutral-500 transition-colors hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-100">← all posts</a>
      </div>
    {{ end }}
  </article>
{{ end }}
