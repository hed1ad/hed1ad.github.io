<li>
  <div class="mb-1 text-xs text-neutral-500 dark:text-neutral-400">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
  </div>
  <h2 class="text-lg font-medium leading-snug">
    <a href="{{ .RelPermalink }}" class="text-neutral-900 hover:underline dark:text-neutral-100">{{ .Title }}</a>
  </h2>
  {{ with .Summary }}
    <p class="mt-1 text-sm text-neutral-600 dark:text-neutral-400">{{ . | plainify | truncate 220 }}</p>
  {{ end }}
  {{ with .GetTerms "tags" }}
    <div class="mt-2 flex flex-wrap gap-2 text-xs text-neutral-500 dark:text-neutral-500">
      {{ range . }}
        <a href="{{ .RelPermalink }}" class="hover:text-blue-600 dark:hover:text-blue-400">#{{ .LinkTitle | lower }}</a>
      {{ end }}
    </div>
  {{ end }}
</li>
