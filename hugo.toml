baseURL = "https://hed1ad.github.io/"
languageCode = "en-us"
title = "hed1ad"
enableRobotsTXT = true
disableKinds = ["RSS"]

[pagination]
  pagerSize = 20

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  description = "Security enthusiast."
  author = "hed1ad"
  [params.social]
    github = "hed1ad"
    telegram = "hed1ad"
    linkedin = "evgeniy-trofimov-953525226"

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
    disableWatch = true

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
